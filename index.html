<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全台夜市即時營業狀態</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 md:p-8">
    <div class="max-w-3xl mx-auto space-y-6">
        
        <!-- Header -->
        <header class="text-center py-4 border-b border-slate-700">
            <h1 class="text-3xl font-bold text-amber-400">🌙 全台夜市即時動態</h1>
            <p class="text-slate-400 text-sm mt-1">氣象即時連線 × 現場民眾回報</p>
        </header>

        <!-- 夜市選擇下拉選單 -->
        <div class="bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700">
            <label for="marketSelect" class="block text-sm font-medium text-slate-300 mb-2">選擇夜市：</label>
            <select id="marketSelect" onchange="fetchMarketData()" class="w-full bg-slate-900 border border-slate-600 text-white rounded-lg p-2.5 focus:ring-2 focus:ring-amber-500 focus:outline-none">
                <option value="逢甲夜市">台中 - 逢甲夜市</option>
                <option value="一中街夜市">台中 - 一中街夜市</option>
                <option value="旱溪夜市">台中 - 旱溪夜市</option>
                <option value="大東夜市">台南 - 大東夜市</option>
                <option value="花園夜市">台南 - 花園夜市</option>
                <option value="武聖夜市">台南 - 武聖夜市</option>
                <option value="士林夜市">台北 - 士林夜市</option>
                <option value="饒河街夜市">台北 - 饒河街夜市</option>
                <option value="寧夏夜市">台北 - 寧夏夜市</option>
                <option value="樂華夜市">新北 - 樂華夜市</option>
                <option value="文化路夜市">嘉義 - 文化路夜市</option>
                <option value="瑞豐夜市">高雄 - 瑞豐夜市</option>
                <option value="六合夜市">高雄 - 六合夜市</option>
                <option value="羅東夜市">宜蘭 - 羅東夜市</option>
            </select>
        </div>

        <!-- 狀態資訊卡片 -->
        <div class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700 space-y-4">
            <div class="flex justify-between items-center">
                <h2 id="marketName" class="text-2xl font-bold text-white">載入中...</h2>
                <span id="openSchedule" class="text-xs bg-slate-700 text-slate-300 px-2.5 py-1 rounded-full">--</span>
            </div>

            <div class="grid grid-cols-2 gap-4 my-4">
                <div class="bg-slate-900/60 p-4 rounded-lg border border-slate-700/50">
                    <div class="text-slate-400 text-xs">降雨機率 (CWA)</div>
                    <div id="rainProb" class="text-xl font-semibold text-sky-400 mt-1">-- %</div>
                </div>
                <div class="bg-slate-900/60 p-4 rounded-lg border border-slate-700/50">
                    <div class="text-slate-400 text-xs">現場打卡熱度</div>
                    <div id="reportCount" class="text-xl font-semibold text-amber-400 mt-1">0 人</div>
                </div>
            </div>

            <div class="border-t border-slate-700 pt-4">
                <div class="text-slate-400 text-xs mb-1">綜合預測狀態</div>
                <div id="statusBadge" class="inline-block px-3 py-1 rounded-md text-sm font-bold bg-slate-700 text-slate-300">
                    查詢中...
                </div>
            </div>
        </div>

        <!-- 現場回報區域 -->
        <div class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700">
            <h3 class="text-lg font-bold text-white mb-3">📍 我在現場，回報近況</h3>
            <div class="grid grid-cols-3 gap-3">
                <button onclick="submitReport('Open')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 px-4 rounded-lg transition active:scale-95">
                    🟢 熱鬧營業中
                </button>
                <button onclick="submitReport('Few')" class="bg-amber-600 hover:bg-amber-500 text-white font-medium py-2.5 px-4 rounded-lg transition active:scale-95">
                    🟡 攤位較少
                </button>
                <button onclick="submitReport('Closed')" class="bg-rose-600 hover:bg-rose-500 text-white font-medium py-2.5 px-4 rounded-lg transition active:scale-95">
                    🔴 沒開/沒攤位
                </button>
            </div>
            <p id="feedbackMsg" class="text-xs text-slate-400 mt-3 text-center min-h-[1rem]"></p>
        </div>

    </div>

    <script>
        // 指向 Render 正式環境後端
        const API_BASE = "https://night-market-api-tntg.onrender.com";

        async function fetchMarketData() {
            const marketName = document.getElementById("marketSelect").value;
            try {
                const res = await fetch(`${API_BASE}/api/market/status?name=${encodeURIComponent(marketName)}`);
                const data = await res.json();

                if (res.ok) {
                    document.getElementById("marketName").innerText = data.market_name;
                    document.getElementById("openSchedule").innerText = `營業日: ${data.open_schedule}`;
                    document.getElementById("rainProb").innerText = `${data.rain_probability}%`;
                    document.getElementById("reportCount").innerText = `${data.recent_reports_count} 人`;

                    const badge = document.getElementById("statusBadge");
                    badge.innerText = data.status;

                    if (data.status.includes("營業中")) {
                        badge.className = "inline-block px-3 py-1 rounded-md text-sm font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
                    } else if (data.status.includes("少")) {
                        badge.className = "inline-block px-3 py-1 rounded-md text-sm font-bold bg-amber-500/20 text-amber-400 border border-amber-500/30";
                    } else {
                        badge.className = "inline-block px-3 py-1 rounded-md text-sm font-bold bg-rose-500/20 text-rose-400 border border-rose-500/30";
                    }
                }
            } catch (err) {
                console.error("無法取得夜市資料:", err);
            }
        }

        async function submitReport(status) {
            const marketName = document.getElementById("marketSelect").value;
            const feedback = document.getElementById("feedbackMsg");
            
            try {
                const res = await fetch(`${API_BASE}/api/market/report`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ market_name: marketName, status: status })
                });
                
                const data = await res.json();
                if (res.ok) {
                    feedback.innerText = "✅ 回報成功！感謝現場提供資訊";
                    feedback.className = "text-xs text-emerald-400 mt-3 text-center";
                    fetchMarketData(); // 重新整理狀態
                } else {
                    feedback.innerText = "❌ 回報失敗，請稍後再試";
                    feedback.className = "text-xs text-rose-400 mt-3 text-center";
                }
            } catch (err) {
                feedback.innerText = "❌ 連線失敗";
                feedback.className = "text-xs text-rose-400 mt-3 text-center";
            }

            setTimeout(() => { feedback.innerText = ""; }, 3000);
        }

        // 首次載入
        fetchMarketData();
    </script>
</body>
</html>
